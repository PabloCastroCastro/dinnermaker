name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sintaxis de JS (node --check)
        run: |
          for f in js/*.js service-worker.js; do
            echo "::group::$f"
            node --input-type=module --check < "$f"
            echo "::endgroup::"
          done

      - name: Tests y validación de /data (node --test)
        run: node --test
